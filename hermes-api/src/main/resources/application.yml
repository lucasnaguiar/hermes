spring:
  datasource:
    url: jdbc:h2:mem:hermes
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api/v1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180}