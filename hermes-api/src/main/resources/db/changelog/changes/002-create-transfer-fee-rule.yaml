databaseChangeLog:
  - changeSet:
      id: 002-create-transfer-fee-rule
      author: lucas
      changes:
        - createTable:
            tableName: transfer_fee_rule
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: days_range_from
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: days_range_to
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: fixed_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: DECIMAL(5,4)
                  constraints:
                    nullable: false